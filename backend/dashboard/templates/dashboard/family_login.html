<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Famille</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: { 600: '#c25e25', 700: '#a04a1e' } } } } }
  </script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-pink-50 to-blue-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-indigo-100 to-pink-100 mb-4">
        <i class="fas fa-users text-2xl text-indigo-600"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Espace Famille</h1>
      <p class="text-gray-500 text-sm mt-2">Acces reserve aux comptes familles</p>
    </div>

    {% if error %}
    <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Login</label>
        <input type="text" name="username" required autofocus class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
        <input type="password" name="password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
      </div>
      <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-pink-600 text-white rounded-lg hover:opacity-90 font-medium">
        <i class="fas fa-sign-in-alt mr-2"></i>Se connecter
      </button>
    </form>

    <p class="text-xs text-gray-400 text-center mt-6">
      Un compte famille ne peut etre connecte que sur un seul appareil a la fois.
    </p>
  </div>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</body>
</html>
