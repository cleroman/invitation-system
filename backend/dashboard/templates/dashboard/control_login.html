<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Controleur</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: {
      50: '#fdf8f3', 100: '#faebd7', 200: '#f5d5b3', 300: '#eeb888',
      400: '#e59a5e', 500: '#d97a3a', 600: '#c25e25', 700: '#a04a1e',
      800: '#7d3a1a', 900: '#5e2b14',
    } } } } }
  </script>
</head>
<body class="bg-gradient-to-br from-brand-50 via-pink-50 to-blue-50 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-brand-100 mb-4">
        <svg class="w-8 h-8 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Connexion Controleur</h1>
      <p class="text-gray-500 text-sm mt-2">Acces reserve aux controleurs autorises</p>
    </div>

    {% if error %}
    <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded">
      <div class="flex items-start gap-2">
        <svg class="w-5 h-5 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
        </svg>
        <span class="text-sm">{{ error }}</span>
      </div>
    </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Login</label>
        <input type="text" name="username" required autofocus
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
        <input type="password" name="password" required
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
      </div>
      <button type="submit"
              class="w-full py-3 bg-brand-600 text-white rounded-lg hover:bg-brand-700 font-medium transition">
        Se connecter
      </button>
    </form>

    <p class="text-xs text-gray-400 text-center mt-6">
      Un controleur ne peut etre connecte que sur un seul appareil a la fois.<br>
      Si vous vous connectez ailleurs, la session precedente sera deconnectee.
    </p>
  </div>
</body>
</html>
